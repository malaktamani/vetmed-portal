<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — VetStudy</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a26;
      --accent: #7c6af7; --accent2: #4ecdc4; --accent3: #f7c06a;
      --text: #f0eeff; --muted: #7a7a9a; --border: rgba(255,255,255,0.08);
      --success: #4ecdc4; --danger: #f7756a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
    .login-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .login-card h2 { font-family: 'Syne', sans-serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
    .input { width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
    .input:focus { border-color: var(--accent); }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .admin-panel { display: none; }
    header { padding: 1.2rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; }
    .logo-text span { color: var(--accent); }
    .admin-badge { background: rgba(247,192,106,0.15); color: var(--accent3); border: 1px solid rgba(247,192,106,0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .logout-btn { background: rgba(247,117,106,0.1); color: var(--danger); border: 1px solid rgba(247,117,106,0.2); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .logout-btn:hover { background: rgba(247,117,106,0.25); }
    .content { padding: 2rem; max-width: 900px; margin: 0 auto; }
    .section-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .upload-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; margin-bottom: 2rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    select.input { cursor: pointer; }
    .file-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 12px; }
    .file-zone:hover { border-color: var(--accent); }
    .file-zone p { color: var(--muted); font-size: 14px; }
    #fileInput { display: none; }
    .queue { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
    .queue-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; display: flex; align-items: center; gap: 10px; }
    .queue-item .fname { flex: 1; font-size: 13px; }
    .queue-item input.input { margin: 0; padding: 8px 12px; font-size: 13px; }
    .queue-item .remove-btn { background: rgba(247,117,106,0.1); color: var(--danger); border: 1px solid rgba(247,117,106,0.2); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .queue-item .status { font-size: 12px; min-width: 80px; text-align: right; }
    .status-pending { color: var(--muted); }
    .status-uploading { color: var(--accent3); }
    .status-done { color: var(--success); }
    .status-error { color: var(--danger); }
    .upload-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
    .upload-btn:hover { opacity: 0.9; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar-wrap { background: var(--bg3); border-radius: 10px; height: 8px; margin: 12px 0; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width 0.3s; width: 0%; }
    .success-msg { color: var(--success); font-size: 13px; margin-top: 8px; text-align: center; }
    .fichiers-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; margin-bottom: 2rem; }
    .filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.2rem; }
    .fichier-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .fichier-info { flex: 1; }
    .fichier-nom { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .fichier-meta { font-size: 12px; color: var(--muted); }
    .delete-btn { background: rgba(247,117,106,0.1); color: var(--danger); border: 1px solid rgba(247,117,106,0.2); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; white-space: nowrap; }
    .delete-btn:hover { background: rgba(247,117,106,0.3); }
    .empty-msg { color: var(--muted); font-size: 14px; text-align: center; padding: 2rem; }
  </style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="icon">🔐</div>
    <h2>Espace Admin</h2>
    <p>Accès réservé — VetStudy</p>
    <input class="input" type="password" id="passwordInput" placeholder="Mot de passe admin" onkeydown="if(event.key==='Enter') login()">
    <button class="btn btn-primary" onclick="login()">Se connecter</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <header>
    <div class="logo">
      <div class="logo-icon">🐾</div>
      <div class="logo-text">Vet<span>Study</span> <span style="color:var(--muted);font-weight:400;font-size:0.85rem">/ Admin</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="admin-badge">👑 Admin</span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="content">

    <div class="section-title">📤 Ajouter des fichiers</div>
    <div class="upload-card">
      <div class="form-grid">
        <div class="form-group">
          <label>Année</label>
          <select class="input" id="annee" onchange="updateModules()">
            <option value="1a">1ère année</option>
            <option value="2a">2ème année</option>
            <option value="3a">3ème année</option>
            <option value="4a">4ème année</option>
            <option value="5a">5ème année</option>
            <option value="6a">6ème année</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semestre</label>
          <select class="input" id="semestre" onchange="updateModules()">
            <option value="s1">Semestre 1</option>
            <option value="s2">Semestre 2</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select class="input" id="ressource" onchange="updateModules()">
            <option value="cours">Cours</option>
            <option value="td">TD</option>
            <option value="tp">TP</option>
            <option value="resumes">Résumés</option>
          </select>
        </div>
        <div class="form-group">
          <label>Module</label>
          <select class="input" id="module"></select>
        </div>
      </div>
      <div class="file-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">
        <p>📁 Clique pour choisir un ou plusieurs PDF</p>
        <p style="font-size:12px;color:var(--muted);margin-top:6px">Tu peux sélectionner plusieurs fichiers à la fois !</p>
      </div>
      <input type="file" id="fileInput" accept=".pdf" multiple onchange="filesSelected(this)">
      <div class="queue" id="fileQueue"></div>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <button class="upload-btn" id="uploadBtn" onclick="uploadAll()" style="display:none">⬆️ Uploader tous les fichiers</button>
      <div class="success-msg" id="uploadMsg"></div>
    </div>

    <div class="section-title">📂 Fichiers sur le site</div>
    <div class="fichiers-card">
      <div class="filter-grid">
        <select class="input" id="fAnnee" onchange="loadFichiers()">
          <option value="">Toutes les années</option>
          <option value="1a">1ère année</option>
          <option value="2a">2ème année</option>
          <option value="3a">3ème année</option>
          <option value="4a">4ème année</option>
          <option value="5a">5ème année</option>
          <option value="6a">6ème année</option>
        </select>
        <select class="input" id="fSemestre" onchange="loadFichiers()">
          <option value="">Tous les semestres</option>
          <option value="s1">Semestre 1</option>
          <option value="s2">Semestre 2</option>
        </select>
        <select class="input" id="fRessource" onchange="loadFichiers()">
          <option value="">Tous les types</option>
          <option value="cours">Cours</option>
          <option value="td">TD</option>
          <option value="tp">TP</option>
          <option value="resumes">Résumés</option>
        </select>
        <button class="btn btn-primary" style="padding:8px" onclick="loadFichiers()">Actualiser</button>
      </div>
      <div id="fichiersList"></div>
    </div>

    <div class="section-title">👥 Utilisateurs inscrits</div>
    <div class="fichiers-card">
      <div id="usersList"></div>
    </div>

  </div>
</div>

<script>
const MODULES = {
  "1a-s1": { cours:["Anatomie","Biochimie","Chimie","Cytologie","Génétique","Histologie","Zoologie"], td:["Biochimie","Chimie","Cytologie","Génétique"], tp:["Anatomie","Biochimie","Chimie","Histologie","Zoologie"], resumes:["Cytologie","Histologie"] },
  "1a-s2": { cours:["Anatomie","Biochimie","Biologie moléculaire","Biophysique","Cytologie","Embryologie","Ethnologie","Éthologie et bien-être","Physiologie","Français"], td:["Biochimie","Biophysique","Cytologie","Embryologie","Physiologie"], tp:["Anatomie","Biochimie","Éthologie et bien-être"], resumes:["Biochimie","Biologie moléculaire","Biophysique","Cytologie","Embryologie","Éthologie et bien-être"] },
  "2a-s1": { cours:["Alimentation","Amélioration génétique et biotechnologie (AGB)","Anatomie 2","Biostatistiques","Ethnologie spéciale","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"], td:["Alimentation","AGB","Biostatistiques","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"], tp:["Alimentation","Ethnologie spéciale"], resumes:["Alimentation","Amélioration génétique et biotechnologie (AGB)","Anatomie 2","Biostatistiques","Ethnologie spéciale","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"] },
  "2a-s2": { cours:["Alimentation","Anatomie 2","Anglais scientifique","Bactériologie générale","Bio-informatique","Elevage et productions animales (EPA)","Histologie spéciale","Physiologie de la reproduction","Virologie générale"], td:["Alimentation","Physiologie de la reproduction","Virologie générale"], tp:["Bactériologie générale","EPA","Histologie spéciale"], resumes:["Alimentation","Anatomie 2","Anglais scientifique","Bactériologie générale","Bio-informatique","Elevage et productions animales (EPA)","Histologie spéciale","Physiologie de la reproduction","Virologie générale"] },
};

let fileQueue = [];

function updateModules() {
  const key = document.getElementById('annee').value + '-' + document.getElementById('semestre').value;
  const res = document.getElementById('ressource').value;
  const sel = document.getElementById('module');
  const mods = MODULES[key] ? MODULES[key][res] || [] : [];
  sel.innerHTML = mods.map(m => `<option value="${m}">${m}</option>`).join('') || '<option>À compléter</option>';
}

function filesSelected(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    if(!fileQueue.find(f => f.file.name === file.name)) {
      fileQueue.push({ file, nom: file.name.replace('.pdf',''), status: 'pending' });
    }
  });
  renderQueue();
  document.getElementById('uploadBtn').style.display = fileQueue.length ? 'block' : 'none';
  input.value = '';
}

function renderQueue() {
  const q = document.getElementById('fileQueue');
  if(!fileQueue.length) { q.innerHTML = ''; return; }
  q.innerHTML = fileQueue.map((item, i) => `
    <div class="queue-item">
      <span class="fname">📄 ${item.file.name}</span>
      <input class="input" type="text" value="${item.nom}" placeholder="Nom affiché" onchange="fileQueue[${i}].nom = this.value" style="flex:1">
      <span class="status status-${item.status}">${statusLabel(item.status)}</span>
      ${item.status === 'pending' ? `<button class="remove-btn" onclick="removeFile(${i})">✕</button>` : ''}
    </div>`).join('');
}

function statusLabel(s) {
  if(s === 'pending') return '⏳ En attente';
  if(s === 'uploading') return '⬆️ Upload...';
  if(s === 'done') return '✅ Fait';
  if(s === 'error') return '❌ Erreur';
  return '';
}

function removeFile(i) {
  fileQueue.splice(i, 1);
  renderQueue();
  document.getElementById('uploadBtn').style.display = fileQueue.length ? 'block' : 'none';
}

async function uploadAll() {
  const pending = fileQueue.filter(f => f.status === 'pending');
  if(!pending.length) return;
  const btn = document.getElementById('uploadBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  btn.disabled = true;
  progressWrap.style.display = 'block';
  let done = 0;
  for(const item of pending) {
    item.status = 'uploading';
    renderQueue();
    const formData = new FormData();
    formData.append('annee',     document.getElementById('annee').value);
    formData.append('semestre',  document.getElementById('semestre').value);
    formData.append('ressource', document.getElementById('ressource').value);
    formData.append('module',    document.getElementById('module').value);
    formData.append('nom',       item.nom);
    formData.append('fichier',   item.file);
    try {
      const res = await fetch('/api/admin/upload', { method:'POST', body: formData });
      const data = await res.json();
      item.status = data.success ? 'done' : 'error';
    } catch(e) {
      item.status = 'error';
    }
    done++;
    progressBar.style.width = (done / pending.length * 100) + '%';
    renderQueue();
  }
  btn.disabled = false;
  const allDone = fileQueue.every(f => f.status === 'done');
  document.getElementById('uploadMsg').textContent = allDone ? '✅ Tous les fichiers uploadés !' : '⚠️ Certains fichiers ont échoué.';
  setTimeout(() => {
    document.getElementById('uploadMsg').textContent = '';
    fileQueue = fileQueue.filter(f => f.status !== 'done');
    renderQueue();
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
    document.getElementById('uploadBtn').style.display = fileQueue.length ? 'block' : 'none';
    loadFichiers();
  }, 3000);
}

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: pwd}) });
  const data = await res.json();
  if(data.success) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    updateModules(); loadFichiers(); loadUtilisateurs();
  } else {
    document.getElementById('loginError').textContent = 'Mot de passe incorrect !';
  }
}

async function logout() {
  await fetch('/api/admin/logout', {method:'POST'});
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('passwordInput').value = '';
}

async function loadFichiers() {
  const annee     = document.getElementById('fAnnee').value;
  const semestre  = document.getElementById('fSemestre').value;
  const ressource = document.getElementById('fRessource').value;
  let url = '/api/admin/fichiers?';
  if(annee)     url += `annee=${annee}&`;
  if(semestre)  url += `semestre=${semestre}&`;
  if(ressource) url += `ressource=${ressource}&`;
  const res = await fetch(url);
  const fichiers = await res.json();
  const list = document.getElementById('fichiersList');
  const anneeLabel = {'1a':'1ère année','2a':'2ème année','3a':'3ème année','4a':'4ème année','5a':'5ème année','6a':'6ème année'};
  const semLabel   = {'s1':'Semestre 1','s2':'Semestre 2'};
  const resLabel   = {'cours':'Cours','td':'TD','tp':'TP','resumes':'Résumés'};
  if(!fichiers.length) { list.innerHTML = '<div class="empty-msg">Aucun fichier pour l\'instant</div>'; return; }
  list.innerHTML = fichiers.map(f => `
    <div class="fichier-item">
      <div class="fichier-info">
        <div class="fichier-nom">📄 ${f.nom}</div>
        <div class="fichier-meta">${anneeLabel[f.annee]||f.annee} · ${semLabel[f.semestre]||f.semestre} · ${resLabel[f.ressource]||f.ressource} · ${f.module}</div>
      </div>
      <button class="delete-btn" onclick="deleteFichier(${f.id})">🗑️ Supprimer</button>
    </div>`).join('');
}

async function loadUtilisateurs() {
  const res = await fetch('/api/admin/utilisateurs');
  const users = await res.json();
  const list = document.getElementById('usersList');
  if(!users.length) { list.innerHTML = '<div class="empty-msg">Aucun utilisateur inscrit</div>'; return; }
  list.innerHTML = users.map(u => `
    <div class="fichier-item">
      <div class="fichier-info">
        <div class="fichier-nom">👤 ${u.prenom} ${u.nom}</div>
        <div class="fichier-meta">${u.email} · ${u.niveau} · Inscrit le ${u.date_inscription}</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${u.actif ? 'rgba(78,205,196,0.15)' : 'rgba(247,117,106,0.15)'};color:${u.actif ? '#4ecdc4' : '#f7756a'}">
            ${u.actif ? '✅ Actif' : '🚫 Bloqué'}
          </span>
          <span style="font-size:11px;padding:2px 8px;border-radius:10px;background:${u.premium ? 'rgba(247,192,106,0.15)' : 'rgba(255,255,255,0.05)'};color:${u.premium ? '#f7c06a' : '#7a7a9a'}">
            ${u.premium ? '⭐ Premium' : 'Standard'}
          </span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="delete-btn" style="background:rgba(124,106,247,0.1);color:#7c6af7;border-color:rgba(124,106,247,0.3)" onclick="toggleActif(${u.id})">${u.actif ? 'Bloquer' : 'Débloquer'}</button>
        <button class="delete-btn" style="background:rgba(247,192,106,0.1);color:#f7c06a;border-color:rgba(247,192,106,0.3)" onclick="togglePremium(${u.id})">${u.premium ? 'Retirer Premium' : '⭐ Donner Premium'}</button>
        <button class="delete-btn" onclick="deleteUser(${u.id})">🗑️ Supprimer</button>
      </div>
    </div>`).join('');
}

async function toggleActif(id) {
  await fetch(`/api/admin/utilisateur/${id}/toggle_actif`, {method:'POST'});
  loadUtilisateurs();
}

async function togglePremium(id) {
  await fetch(`/api/admin/utilisateur/${id}/toggle_premium`, {method:'POST'});
  loadUtilisateurs();
}

async function deleteUser(id) {
  if(!confirm('Supprimer cet utilisateur ?')) return;
  await fetch(`/api/admin/utilisateur/${id}`, {method:'DELETE'});
  loadUtilisateurs();
}

async function deleteFichier(id) {
  if(!confirm('Supprimer ce fichier ?')) return;
  await fetch(`/api/admin/delete/${id}`, {method:'DELETE'});
  loadFichiers();
}

updateModules();
</script>
</body>
</html>
