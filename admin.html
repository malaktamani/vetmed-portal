<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — VetStudy</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a26;
      --accent: #7c6af7; --accent2: #4ecdc4; --accent3: #f7c06a;
      --text: #f0eeff; --muted: #7a7a9a; --border: rgba(255,255,255,0.08);
      --success: #4ecdc4; --danger: #f7756a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOGIN */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 380px; text-align: center;
    }
    .login-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .login-card h2 { font-family: 'Syne', sans-serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; }
    .input {
      width: 100%; padding: 12px 16px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-danger { background: rgba(247,117,106,0.15); color: var(--danger); border: 1px solid rgba(247,117,106,0.3); }
    .btn-danger:hover { background: rgba(247,117,106,0.3); }
    .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; }

    /* ADMIN PANEL */
    .admin-panel { display: none; }
    header {
      padding: 1.2rem 2rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1rem; }
    .logo-text span { color: var(--accent); }
    .admin-badge {
      background: rgba(247,192,106,0.15); color: var(--accent3);
      border: 1px solid rgba(247,192,106,0.3);
      padding: 4px 12px; border-radius: 20px; font-size: 12px;
    }
    .logout-btn {
      background: rgba(247,117,106,0.1); color: var(--danger);
      border: 1px solid rgba(247,117,106,0.2); padding: 6px 16px;
      border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .logout-btn:hover { background: rgba(247,117,106,0.25); }

    .content { padding: 2rem; max-width: 900px; margin: 0 auto; }

    /* UPLOAD FORM */
    .section-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1.2rem; margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: 8px;
    }
    .upload-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.8rem; margin-bottom: 2rem;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    select.input { cursor: pointer; }
    .file-zone {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 2rem; text-align: center; cursor: pointer;
      transition: border-color 0.2s; margin-bottom: 12px;
    }
    .file-zone:hover { border-color: var(--accent); }
    .file-zone.has-file { border-color: var(--success); }
    .file-zone p { color: var(--muted); font-size: 14px; }
    .file-zone .file-name { color: var(--success); font-size: 14px; font-weight: 500; margin-top: 8px; }
    #fileInput { display: none; }
    .nom-input { margin-bottom: 12px; }
    .upload-btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: opacity 0.2s;
    }
    .upload-btn:hover { opacity: 0.9; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .success-msg { color: var(--success); font-size: 13px; margin-top: 8px; text-align: center; }

    /* FICHIERS LIST */
    .fichiers-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.8rem;
    }
    .filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.2rem; }
    .fichier-item {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 8px;
    }
    .fichier-info { flex: 1; }
    .fichier-nom { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .fichier-meta { font-size: 12px; color: var(--muted); }
    .delete-btn {
      background: rgba(247,117,106,0.1); color: var(--danger);
      border: 1px solid rgba(247,117,106,0.2); padding: 6px 14px;
      border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: all 0.2s; white-space: nowrap;
    }
    .delete-btn:hover { background: rgba(247,117,106,0.3); }
    .empty-msg { color: var(--muted); font-size: 14px; text-align: center; padding: 2rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="icon">🔐</div>
    <h2>Espace Admin</h2>
    <p>Accès réservé — VetStudy</p>
    <input class="input" type="password" id="passwordInput" placeholder="Mot de passe admin" onkeydown="if(event.key==='Enter') login()">
    <button class="btn btn-primary" onclick="login()">Se connecter</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="adminPanel">
  <header>
    <div class="logo">
      <div class="logo-icon">🐾</div>
      <div class="logo-text">Vet<span>Study</span> <span style="color:var(--muted);font-weight:400;font-size:0.85rem">/ Admin</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="admin-badge">👑 Admin</span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </header>

  <div class="content">

    <!-- UPLOAD -->
    <div class="section-title">📤 Ajouter un fichier</div>
    <div class="upload-card">
      <div class="form-grid">
        <div class="form-group">
          <label>Année</label>
          <select class="input" id="annee" onchange="updateModules()">
            <option value="1a">1ère année</option>
            <option value="2a">2ème année</option>
            <option value="3a">3ème année</option>
            <option value="4a">4ème année</option>
            <option value="5a">5ème année</option>
            <option value="6a">6ème année</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semestre</label>
          <select class="input" id="semestre" onchange="updateModules()">
            <option value="s1">Semestre 1</option>
            <option value="s2">Semestre 2</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select class="input" id="ressource" onchange="updateModules()">
            <option value="cours">Cours</option>
            <option value="td">TD</option>
            <option value="tp">TP</option>
            <option value="resumes">Résumés</option>
          </select>
        </div>
        <div class="form-group">
          <label>Module</label>
          <select class="input" id="module"></select>
        </div>
      </div>

      <div class="form-group nom-input">
        <label>Nom du fichier (affiché sur le site)</label>
        <input class="input" type="text" id="nomFichier" placeholder="Ex: Unité 1 — Atomistique">
      </div>

      <div class="file-zone" id="fileZone" onclick="document.getElementById('fileInput').click()">
        <p>📁 Clique pour choisir un PDF</p>
        <div class="file-name" id="fileName"></div>
      </div>
      <input type="file" id="fileInput" accept=".pdf" onchange="fileSelected(this)">

      <button class="upload-btn" onclick="uploadFichier()">⬆️ Uploader le fichier</button>
      <div class="success-msg" id="uploadMsg"></div>
    </div>

    <!-- LISTE FICHIERS -->
    <div class="section-title">📂 Fichiers sur le site</div>
    <div class="fichiers-card">
      <div class="filter-grid">
        <select class="input" id="fAnnee" onchange="loadFichiers()">
          <option value="">Toutes les années</option>
          <option value="1a">1ère année</option>
          <option value="2a">2ème année</option>
          <option value="3a">3ème année</option>
          <option value="4a">4ème année</option>
          <option value="5a">5ème année</option>
          <option value="6a">6ème année</option>
        </select>
        <select class="input" id="fSemestre" onchange="loadFichiers()">
          <option value="">Tous les semestres</option>
          <option value="s1">Semestre 1</option>
          <option value="s2">Semestre 2</option>
        </select>
        <select class="input" id="fRessource" onchange="loadFichiers()">
          <option value="">Tous les types</option>
          <option value="cours">Cours</option>
          <option value="td">TD</option>
          <option value="tp">TP</option>
          <option value="resumes">Résumés</option>
        </select>
        <button class="btn btn-primary" style="padding:8px" onclick="loadFichiers()">Actualiser</button>
      </div>
      <div id="fichiersList"></div>
    </div>

  </div>
</div>

<script>
const MODULES = {
  "1a-s1": { cours:["Anatomie","Biochimie","Chimie","Cytologie","Génétique","Histologie","Zoologie"], td:["Biochimie","Chimie","Cytologie","Génétique"], tp:["Anatomie","Biochimie","Chimie","Histologie","Zoologie"], resumes:["Biochimie","Cytologie","Histologie"] },
  "1a-s2": { cours:["Anatomie","Biochimie","Biologie moléculaire","Biophysique","Cytologie","Embryologie","Ethnologie","Éthologie et bien-être","Physiologie","Français"], td:["Biochimie","Biophysique","Cytologie","Embryologie"], tp:["Anatomie","Biochimie","Éthologie et bien-être"], resumes:["Biochimie","Biologie moléculaire","Biophysique","Cytologie","Embryologie","Éthologie et bien-être"] },
  "2a-s1": { cours:["Alimentation","AGB","Anatomie 2","Biostatistiques","Ethnologie spéciale","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"], td:["Alimentation","AGB","Biostatistiques","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"], tp:["Alimentation","Ethnologie spéciale"], resumes:["Alimentation","AGB","Anatomie 2","Biostatistiques","Ethnologie spéciale","Immuno-vaccinologie","Physiologie 2","Physiologie de la reproduction"] },
  "2a-s2": { cours:["Alimentation","Anatomie 2","Anglais scientifique","Bactériologie générale","Bio-informatique","EPA","Histologie spéciale","Physiologie de la reproduction","Virologie générale"], td:["Alimentation","Physiologie de la reproduction","Virologie générale"], tp:["Bactériologie générale","EPA","Histologie spéciale"], resumes:["Alimentation","Anatomie 2","Anglais scientifique","Bactériologie générale","Bio-informatique","EPA","Histologie spéciale","Physiologie de la reproduction","Virologie générale"] },
};

function updateModules() {
  const key = document.getElementById('annee').value + '-' + document.getElementById('semestre').value;
  const res = document.getElementById('ressource').value;
  const sel = document.getElementById('module');
  const mods = MODULES[key] ? MODULES[key][res] || [] : [];
  sel.innerHTML = mods.map(m => `<option value="${m}">${m}</option>`).join('') || '<option>À compléter</option>';
}

function fileSelected(input) {
  const file = input.files[0];
  if(file) {
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileZone').classList.add('has-file');
    if(!document.getElementById('nomFichier').value) {
      document.getElementById('nomFichier').value = file.name.replace('.pdf','');
    }
  }
}

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pwd})
  });
  const data = await res.json();
  if(data.success) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    updateModules();
    loadFichiers();
  } else {
    document.getElementById('loginError').textContent = 'Mot de passe incorrect !';
  }
}

async function logout() {
  await fetch('/api/admin/logout', {method:'POST'});
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('passwordInput').value = '';
}

async function uploadFichier() {
  const file = document.getElementById('fileInput').files[0];
  const nom = document.getElementById('nomFichier').value;
  if(!file) { alert('Choisis un fichier !'); return; }
  if(!nom)  { alert('Donne un nom au fichier !'); return; }

  const formData = new FormData();
  formData.append('annee',     document.getElementById('annee').value);
  formData.append('semestre',  document.getElementById('semestre').value);
  formData.append('ressource', document.getElementById('ressource').value);
  formData.append('module',    document.getElementById('module').value);
  formData.append('nom',       nom);
  formData.append('fichier',   file);

  const btn = document.querySelector('.upload-btn');
  btn.disabled = true; btn.textContent = 'Upload en cours...';

  const res = await fetch('/api/admin/upload', {method:'POST', body: formData});
  const data = await res.json();

  btn.disabled = false; btn.textContent = '⬆️ Uploader le fichier';

  if(data.success) {
    document.getElementById('uploadMsg').textContent = '✅ Fichier ajouté avec succès !';
    document.getElementById('fileInput').value = '';
    document.getElementById('fileName').textContent = '';
    document.getElementById('fileZone').classList.remove('has-file');
    document.getElementById('nomFichier').value = '';
    setTimeout(() => document.getElementById('uploadMsg').textContent = '', 3000);
    loadFichiers();
  }
}

async function loadFichiers() {
  const annee    = document.getElementById('fAnnee').value;
  const semestre = document.getElementById('fSemestre').value;
  const ressource= document.getElementById('fRessource').value;

  let url = '/api/admin/fichiers?';
  if(annee)     url += `annee=${annee}&`;
  if(semestre)  url += `semestre=${semestre}&`;
  if(ressource) url += `ressource=${ressource}&`;

  const res = await fetch(url);
  const fichiers = await res.json();
  const list = document.getElementById('fichiersList');

  if(!fichiers.length) {
    list.innerHTML = '<div class="empty-msg">Aucun fichier pour l\'instant</div>';
    return;
  }

  const anneeLabel = { '1a':'1ère année','2a':'2ème année','3a':'3ème année','4a':'4ème année','5a':'5ème année','6a':'6ème année' };
  const semLabel   = { 's1':'Semestre 1','s2':'Semestre 2' };
  const resLabel   = { 'cours':'Cours','td':'TD','tp':'TP','resumes':'Résumés' };

  list.innerHTML = fichiers.map(f => `
    <div class="fichier-item">
      <div class="fichier-info">
        <div class="fichier-nom">📄 ${f.nom}</div>
        <div class="fichier-meta">${anneeLabel[f.annee]||f.annee} · ${semLabel[f.semestre]||f.semestre} · ${resLabel[f.ressource]||f.ressource} · ${f.module}</div>
      </div>
      <button class="delete-btn" onclick="deleteFichier(${f.id})">🗑️ Supprimer</button>
    </div>`).join('');
}

async function deleteFichier(id) {
  if(!confirm('Supprimer ce fichier ?')) return;
  await fetch(`/api/admin/delete/${id}`, {method:'DELETE'});
  loadFichiers();
}

updateModules();
</script>
</body>
</html>
